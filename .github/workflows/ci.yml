name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build web app
        run: npm run build --workspace web
      - name: Run schema tests
        run: npm run test --workspace packages/schema --if-present
